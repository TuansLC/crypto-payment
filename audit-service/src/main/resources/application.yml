server:
  port: 8085

spring:
  application:
    name: audit-service
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false   # bỏ qua field lạ → event/DTO evolution an toàn
    default-property-inclusion: non_null   # ẩn field null trong response
  datasource:
    url: jdbc:postgresql://localhost:5432/audit_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # group-id RIÊNG → nhận bản sao mọi event, không giành với consumer nghiệp vụ
      group-id: audit-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer bọc JsonDeserializer → lỗi deserialize (poison pill)
      # được DefaultErrorHandler đẩy sang .DLT thay vì crash-loop vô hạn
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    listener:
      # ack-mode RECORD: commit offset sau khi listener trả về thành công (đồng bộ, không @Async)
      ack-mode: record
# audit-service subscribe tất cả topic: user.events, wallet.commands,
# wallet.events, payment.events, wallet.dlq
