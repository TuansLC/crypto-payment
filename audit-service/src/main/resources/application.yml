server:
  port: 8085

spring:
  application:
    name: audit-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/audit_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # group-id RIÊNG → nhận bản sao mọi event, không giành với consumer nghiệp vụ
      group-id: audit-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
# audit-service subscribe tất cả topic: user.events, wallet.commands,
# wallet.events, payment.events, wallet.dlq
