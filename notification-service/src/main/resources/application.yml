server:
  port: 8084

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false   # bỏ qua field lạ → event/DTO evolution an toàn
    default-property-inclusion: non_null   # ẩn field null trong response
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer bọc JsonDeserializer → lỗi deserialize (poison pill)
      # được DefaultErrorHandler đẩy sang .DLT thay vì crash-loop vô hạn
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    listener:
      # ack-mode RECORD: commit offset sau khi listener trả về thành công (đồng bộ, không @Async)
      ack-mode: record
