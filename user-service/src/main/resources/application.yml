server:
  port: 8081

spring:
  application:
    name: user-service
  # Java 21 Virtual Threads — mỗi request/consumer chạy trên virtual thread rẻ tiền
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false   # bỏ qua field lạ → event/DTO evolution an toàn
    default-property-inclusion: non_null   # ẩn field null trong response
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Schema do init-db quản lý; 'update' an toàn cho dev, không drop dữ liệu
      ddl-auto: update
    show-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all                 # chờ mọi replica ISR ack → durability
      retries: 3
      properties:
        enable.idempotence: true   # broker chống duplicate ở tầng network (fintech)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  # Outbox Publisher — tuning được theo môi trường, không cần sửa code
  outbox:
    poll-delay-ms: 1000   # OutboxPublisherJob đọc trực tiếp qua @Scheduled(fixedDelayString)
    batch-size: 100       # số event mỗi chu kỳ; lớn quá → transaction dài, giữ row lock lâu
    max-retries: 3        # vượt ngưỡng → status=FAILED, cần điều tra thủ công

  # JWT config
  jwt:
    # ⚠️ secret PHẢI >= 32 ký tự (256 bit) cho HS256, nếu không jjwt ném WeakKeyException.
    # Production: đưa vào env var / secret manager, KHÔNG hardcode.
    secret: change-me-to-a-long-random-secret-key-at-least-256-bits-please
    expiration-ms: 86400000   # 24h
